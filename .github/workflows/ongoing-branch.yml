name: Update Docker image for ongoing branches

on:
  schedule:
    - cron: "0 */12 * * *"
  repository_dispatch:
    types:
      - build-ongoing

jobs:

  generate_matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      generated-matrix: ${{ steps.generate-matrix.outputs.generated-matrix }}
    steps:
      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: none
          tools: none
          coverage: none
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Generate matrix
        id: generate-matrix
        run: ./.github/workflows/generate-matrix ongoing-branch.yml "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.data.image_tag }}
    runs-on: ubuntu-latest
    needs:
      - generate_matrix
    strategy:
      matrix:
        data: ${{ fromJSON(needs.generate_matrix.outputs.generated-matrix) }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      -
        name: Check if build is needed
        id: check
        run: ./.github/workflows/ongoing-branch-check ${{ matrix.data.repo_branch }} ${{ matrix.data.c5_startingpoint }}
      -
        name: Set up QEMU
        if: steps.check.outputs.BUILD_SHA1
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      -
        name: Set up Docker Buildx
        if: steps.check.outputs.BUILD_SHA1
        uses: docker/setup-buildx-action@v4
      -
        name: Configure build
        id: config
        if: steps.check.outputs.BUILD_SHA1
        run: |
          tags='ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }}'
          for additional_tag in ${{ matrix.data.additional_tags }}; do
            tags="$tags,ghcr.io/concrete5-community/docker5:$additional_tag"
          done
          echo "tags=$tags" >> $GITHUB_OUTPUT
      -
        name: Build with starting point ${{ matrix.data.c5_startingpoint }}
        if: steps.check.outputs.BUILD_SHA1
        uses: docker/build-push-action@v7
        with:
          context: ./installed
          platforms: linux/amd64
          build-args: |
            CI=true
            CCM_PHP_VERSION=${{ matrix.data.php_version }}
            CCM_COMPOSER_VERSION=${{ matrix.data.composer_version }}
            CCM_PHPUNIT_VERSION=${{ matrix.data.phpunit_version }}
            CCM_C5_ARCHIVE=https://codeload.github.com/concretecms/concretecms/tar.gz/${{ steps.check.outputs.BUILD_SHA1 }}
            CCM_STARTING_POINT=${{ matrix.data.c5_startingpoint }}
            CCM_PATCH_ENVIRONMENT_ONLY=${{ matrix.data.patch_environment_only }}
          tags: ${{ steps.config.outputs.tags }}
          # Load the amd64 image into the local Docker image store, so that we can test it
          load: true
      -
        name: Check that MariaDB works
        if: steps.check.outputs.BUILD_SHA1
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-service start db
      -
        name: Login to the Docker container registry
        if: steps.check.outputs.BUILD_SHA1
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Publish multi-platform image
        if: steps.check.outputs.BUILD_SHA1
        uses: docker/build-push-action@v7
        with:
          context: ./installed
          platforms: linux/amd64,linux/arm64
          build-args: |
            CI=true
            CCM_PHP_VERSION=${{ matrix.data.php_version }}
            CCM_COMPOSER_VERSION=${{ matrix.data.composer_version }}
            CCM_PHPUNIT_VERSION=${{ matrix.data.phpunit_version }}
            CCM_C5_ARCHIVE=https://codeload.github.com/concretecms/concretecms/tar.gz/${{ steps.check.outputs.BUILD_SHA1 }}
            CCM_STARTING_POINT=${{ matrix.data.c5_startingpoint }}
            CCM_PATCH_ENVIRONMENT_ONLY=${{ matrix.data.patch_environment_only }}
          tags: ${{ steps.config.outputs.tags }}
          # The amd64 image comes from the build cache: only the arm64 one is actually built here
          push: true
      -
        name: Update repository
        if: steps.check.outputs.BUILD_SHA1
        env:
          BUILT_SHA1: ${{ steps.check.outputs.BUILD_SHA1 }}
        run: ./.github/workflows/ongoing-branch-updated ${{ matrix.data.repo_branch }} ${{ matrix.data.c5_startingpoint }}
      -
        name: Notify failures
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: '-1001989057474'
          message: Building ongoing branches failed on https://github.com/concrete5-community/docker5/actions/runs/${{ github.run_id }}
