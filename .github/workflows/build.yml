name: Build Docker images

on:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - .github/workflows/generate-matrix
      - "base/**"
      - "installed/**"
      - data/versions.json
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths:
      - .github/workflows/build.yml
      - .github/workflows/generate-matrix
      - "base/**"
      - "installed/**"
      - data/versions.json
  repository_dispatch:
    types:
      - build
      - publish
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        default: build
        type: choice
        options:
          - build
          - publish
          - update-data-matrix-only

jobs:

  check_envoronment:
    name: Check environment
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.inspect.outputs.action }}
    steps:
      -
        name: Inspect environment
        id: inspect
        run: |
          action=none
          case ${{ github.event_name }} in
            repository_dispatch)
              case "${{ github.event.event_type }}" in
                build)
                  action=build
                  ;;
                publish)
                  action=publish
                  ;;
                *)
                  echo 'Unrecognized event type: ${{ github.event.event_type }}'
                  exit 1
                  ;;
              esac
              ;;
            push)
              case "${{ github.event.head_commit.message }}" in
                \[skip\ ci\]*)
                  ;;
                *)
                  action=publish
                  ;;
              esac
              ;;
            pull_request)
              action=build
              ;;
            workflow_dispatch)
              action='${{ inputs.operation }}'
              ;;
          esac
          echo "action=$action" >> $GITHUB_OUTPUT
      -
        name: Print environment info
        run: |
          printf 'github.event_name: %s\n' "${{ github.event_name }}"
          printf 'github.ref: %s\n' "${{ github.ref }}"
          printf 'Action to be performed: %s\n' "${{ steps.inspect.outputs.action }}"

  # Every image is built natively for each architecture on its own runner (no QEMU emulation).
  # When publishing, every architecture-specific image is pushed by digest (without tags),
  # and a following job creates the tagged multi-platform manifests that reference them.
  build_base:
    name: Build base image (${{ matrix.runner.arch }})
    needs:
      - check_envoronment
    runs-on: ${{ matrix.runner.os }}
    if: needs.check_envoronment.outputs.action == 'build' || needs.check_envoronment.outputs.action == 'publish'
    strategy:
      matrix:
        runner:
          -
            os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          -
            os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to the Docker container registry
        if: needs.check_envoronment.outputs.action == 'publish'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./base
          platforms: ${{ matrix.runner.platform }}
          build-args: CI=true
          # When publishing, push the image by digest (the "base" tag is created by the publish_base job).
          # Otherwise, save it as an OCI image layout archive to be used by the build job.
          tags: ${{ needs.check_envoronment.outputs.action == 'publish' && 'ghcr.io/concrete5-community/docker5' || 'ghcr.io/concrete5-community/docker5:base' }}
          outputs: ${{ needs.check_envoronment.outputs.action == 'publish' && 'type=image,push-by-digest=true,name-canonical=true,push=true' || 'type=oci,dest=/tmp/base-image.tar' }}
      -
        name: Upload base image artifact
        if: needs.check_envoronment.outputs.action == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: base-image-${{ matrix.runner.arch }}
          path: /tmp/base-image.tar
          if-no-files-found: error
      -
        name: Export digest
        if: needs.check_envoronment.outputs.action == 'publish'
        run: |
          mkdir -p /tmp/digests/${{ matrix.runner.arch }}
          printf '%s' '${{ steps.build.outputs.digest }}' > /tmp/digests/${{ matrix.runner.arch }}/digest
      -
        name: Upload digest artifact
        if: needs.check_envoronment.outputs.action == 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: base-digest-${{ matrix.runner.arch }}
          path: /tmp/digests/
          if-no-files-found: error

  publish_base:
    name: Publish base image
    needs:
      - check_envoronment
      - build_base
    runs-on: ubuntu-latest
    if: needs.check_envoronment.outputs.action == 'publish'
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: base-digest-*
          path: /tmp/digests
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to the Docker container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Create multi-platform manifest
        run: |
          sources=''
          for arch in amd64 arm64; do
            digest="$(cat "/tmp/digests/$arch/digest")"
            sources="$sources ghcr.io/concrete5-community/docker5@$digest"
          done
          docker buildx imagetools create --tag ghcr.io/concrete5-community/docker5:base $sources
          docker buildx imagetools inspect ghcr.io/concrete5-community/docker5:base

  generate_matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      generated-matrix: ${{ steps.generate-matrix.outputs.generated-matrix }}
    steps:
      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: none
          tools: none
          coverage: none
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Generate matrix
        id: generate-matrix
        run: ./.github/workflows/generate-matrix build.yml "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.data.image_tag }} (${{ matrix.runner.arch }})
    runs-on: ${{ matrix.runner.os }}
    needs:
      - check_envoronment
      - build_base
      - publish_base
      - generate_matrix
    # publish_base is skipped when not publishing: we still want to run when that's the case
    if: >-
      ${{
        !cancelled()
        && needs.build_base.result == 'success'
        && needs.generate_matrix.result == 'success'
        && (
          (needs.check_envoronment.outputs.action == 'build' && needs.publish_base.result == 'skipped')
          || (needs.check_envoronment.outputs.action == 'publish' && needs.publish_base.result == 'success')
        )
      }}
    strategy:
      matrix:
        data: ${{ fromJSON(needs.generate_matrix.outputs.generated-matrix) }}
        runner:
          -
            os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          -
            os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Download base image
        if: needs.check_envoronment.outputs.action == 'build'
        uses: actions/download-artifact@v8
        with:
          name: base-image-${{ matrix.runner.arch }}
          path: /tmp/
      -
        name: Extract base image
        if: needs.check_envoronment.outputs.action == 'build'
        run: |
          mkdir /tmp/base-image
          tar -xf /tmp/base-image.tar -C /tmp/base-image
          rm /tmp/base-image.tar
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Configure build
        id: config
        run: |
          if [ '${{ needs.check_envoronment.outputs.action }}' = build ]; then
            # Use the (unpublished) base image built by the build_base job
            echo 'build-contexts=ghcr.io/concrete5-community/docker5:base=oci-layout:///tmp/base-image:base' >> $GITHUB_OUTPUT
          else
            echo 'build-contexts=' >> $GITHUB_OUTPUT
          fi
      -
        name: Build with starting point ${{ matrix.data.c5_startingpoint }}
        uses: docker/build-push-action@v7
        with:
          context: ./installed
          platforms: ${{ matrix.runner.platform }}
          build-contexts: ${{ steps.config.outputs.build-contexts }}
          build-args: |
            CI=true
            CCM_PHP_VERSION=${{ matrix.data.php_version }}
            CCM_COMPOSER_VERSION=${{ matrix.data.composer_version }}
            CCM_PHPUNIT_VERSION=${{ matrix.data.phpunit_version }}
            CCM_C5_ARCHIVE=${{ matrix.data.c5_archive }}
            CCM_STARTING_POINT=${{ matrix.data.c5_startingpoint }}
            CCM_PATCH_ENVIRONMENT_ONLY=${{ matrix.data.patch_environment_only }}
          tags: ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }}
          # Load the image into the local Docker image store, so that we can test it
          load: true
      -
        name: Check that MariaDB works
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-service start db
      -
        name: Test installing composerpkg
        if: needs.check_envoronment.outputs.action == 'build' && matrix.data.image_tag == '9.4.1'
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-install composerpkg
      -
        name: Test installing Blocks Cloner
        if: needs.check_envoronment.outputs.action == 'build' && matrix.data.image_tag == '9.4.1'
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-install blocks_cloner
      -
        name: Test installing concrete-cif
        if: needs.check_envoronment.outputs.action == 'build' && matrix.data.image_tag == '9.4.1'
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-install concrete-cif
      -
        name: Test installing PHP CS Fixer
        if: needs.check_envoronment.outputs.action == 'build' && matrix.data.image_tag == '9.4.1'
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-install php-cs-fixer
      -
        name: Login to the Docker container registry
        if: needs.check_envoronment.outputs.action == 'publish'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Push image by digest
        id: push
        if: needs.check_envoronment.outputs.action == 'publish'
        uses: docker/build-push-action@v7
        with:
          context: ./installed
          platforms: ${{ matrix.runner.platform }}
          build-contexts: ${{ steps.config.outputs.build-contexts }}
          build-args: |
            CI=true
            CCM_PHP_VERSION=${{ matrix.data.php_version }}
            CCM_COMPOSER_VERSION=${{ matrix.data.composer_version }}
            CCM_PHPUNIT_VERSION=${{ matrix.data.phpunit_version }}
            CCM_C5_ARCHIVE=${{ matrix.data.c5_archive }}
            CCM_STARTING_POINT=${{ matrix.data.c5_startingpoint }}
            CCM_PATCH_ENVIRONMENT_ONLY=${{ matrix.data.patch_environment_only }}
          # The image comes from the build cache of the previous step: nothing is actually rebuilt here.
          # It's pushed without tags: the tagged multi-platform manifests are created by the publish job.
          tags: ghcr.io/concrete5-community/docker5
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      -
        name: Export digest
        if: needs.check_envoronment.outputs.action == 'publish'
        run: |
          mkdir -p '/tmp/digests/${{ matrix.runner.arch }}-${{ matrix.data.image_tag }}'
          printf '%s' '${{ steps.push.outputs.digest }}' > '/tmp/digests/${{ matrix.runner.arch }}-${{ matrix.data.image_tag }}/digest'
      -
        name: Upload digest artifact
        if: needs.check_envoronment.outputs.action == 'publish'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner.arch }}-${{ matrix.data.image_tag }}
          path: /tmp/digests/
          if-no-files-found: error

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs:
      - check_envoronment
      - generate_matrix
      - build
    if: needs.check_envoronment.outputs.action == 'publish'
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to the Docker container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Create multi-platform manifests
        env:
          GENERATED_MATRIX: ${{ needs.generate_matrix.outputs.generated-matrix }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          mapfile -t entries < <(printf '%s' "$GENERATED_MATRIX" | jq -c '.[]')
          for entry in "${entries[@]}"; do
            image_tag="$(printf '%s' "$entry" | jq -r '.image_tag')"
            additional_tags="$(printf '%s' "$entry" | jq -r '.additional_tags')"
            echo "::group::Publishing $image_tag"
            tags="--tag ghcr.io/concrete5-community/docker5:$image_tag"
            for additional_tag in $additional_tags; do
              tags="$tags --tag ghcr.io/concrete5-community/docker5:$additional_tag"
            done
            sources=''
            for arch in amd64 arm64; do
              digest="$(cat "/tmp/digests/$arch-$image_tag/digest")"
              sources="$sources ghcr.io/concrete5-community/docker5@$digest"
            done
            docker buildx imagetools create $tags $sources
            docker buildx imagetools inspect "ghcr.io/concrete5-community/docker5:$image_tag"
            echo '::endgroup::'
          done

  store-data-matrix:
    name: Store data matrix
    runs-on: ubuntu-latest
    needs:
      - check_envoronment
      - generate_matrix
    if: needs.check_envoronment.outputs.action == 'publish' || needs.check_envoronment.outputs.action == 'update-data-matrix-only'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      -
        name: Store data matrix
        env:
          GENERATED_MATRIX: ${{ needs.generate_matrix.outputs.generated-matrix }}
        run: printf '%s' "$GENERATED_MATRIX" >data/matrix.json
      -
        name: Commit data matrix
        run: |
          git add data/matrix.json
          if git diff --cached --color=always --exit-code data/matrix.json; then
            echo 'No changes'
          else
            git config --local user.name 'GitHub Actions'
            git config --local user.email noreply@github.com
            git add data/matrix.json
            git commit -m 'Update data matrix'
            git push
          fi
