name: Build Docker images

on:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - .github/workflows/generate-matrix
      - "base/**"
      - "installed/**"
      - data/versions.json
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths:
      - .github/workflows/build.yml
      - .github/workflows/generate-matrix
      - "base/**"
      - "installed/**"
      - data/versions.json
  repository_dispatch:
    types:
      - build
      - publish
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        default: build
        type: choice
        options:
          - build
          - publish
          - update-data-matrix-only

jobs:

  check_envoronment:
    name: Check environment
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.inspect.outputs.action }}
    steps:
      -
        name: Inspect environment
        id: inspect
        run: |
          action=none
          case ${{ github.event_name }} in
            repository_dispatch)
              case "${{ github.event.event_type }}" in
                build)
                  action=build
                  ;;
                publish)
                  action=publish
                  ;;
                *)
                  echo 'Unrecognized event type: ${{ github.event.event_type }}'
                  exit 1
                  ;;
              esac
              ;;
            push)
              case "${{ github.event.head_commit.message }}" in
                \[skip\ ci\]*)
                  ;;
                *)
                  action=publish
                  ;;
              esac
              ;;
            pull_request)
              action=build
              ;;
            workflow_dispatch)
              action='${{ inputs.operation }}'
              ;;
          esac
          echo "action=$action" >> $GITHUB_OUTPUT
      -
        name: Print environment info
        run: |
          printf 'github.event_name: %s\n' "${{ github.event_name }}"
          printf 'github.ref: %s\n' "${{ github.ref }}"
          printf 'Action to be performed: %s\n' "${{ steps.inspect.outputs.action }}"

  # Images are built natively per architecture and tagged with an "-<arch>" suffix: the publish jobs create the multi-platform manifests
  # Provenance attestations are disabled: they would add untagged (but referenced) versions to the GHCR package
  build_base:
    name: Build base image (${{ matrix.runner.arch }})
    needs:
      - check_envoronment
    runs-on: ${{ matrix.runner.os }}
    if: needs.check_envoronment.outputs.action == 'build' || needs.check_envoronment.outputs.action == 'publish'
    strategy:
      matrix:
        runner:
          -
            os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          -
            os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to the Docker container registry
        if: needs.check_envoronment.outputs.action == 'publish'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: ./base
          platforms: ${{ matrix.runner.platform }}
          build-args: CI=true
          tags: ${{ needs.check_envoronment.outputs.action == 'publish' && format('ghcr.io/concrete5-community/docker5:base-{0}', matrix.runner.arch) || 'ghcr.io/concrete5-community/docker5:base' }}
          outputs: ${{ needs.check_envoronment.outputs.action == 'publish' && 'type=registry' || 'type=oci,dest=/tmp/base-image.tar' }}
      -
        name: Upload base image artifact
        if: needs.check_envoronment.outputs.action == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: base-image-${{ matrix.runner.arch }}
          path: /tmp/base-image.tar
          if-no-files-found: error

  publish_base:
    name: Publish base image
    needs:
      - check_envoronment
      - build_base
    runs-on: ubuntu-latest
    if: needs.check_envoronment.outputs.action == 'publish'
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to the Docker container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Create multi-platform manifest
        run: |
          docker buildx imagetools create --tag ghcr.io/concrete5-community/docker5:base ghcr.io/concrete5-community/docker5:base-amd64 ghcr.io/concrete5-community/docker5:base-arm64
          docker buildx imagetools inspect ghcr.io/concrete5-community/docker5:base

  generate_matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      generated-matrix: ${{ steps.generate-matrix.outputs.generated-matrix }}
      archives: ${{ steps.generate-matrix.outputs.archives }}
    steps:
      -
        name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: none
          tools: none
          coverage: none
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Generate matrix
        id: generate-matrix
        run: ./.github/workflows/generate-matrix build.yml "$GITHUB_OUTPUT"

  # Lets the builds survive concretecms.org outages, and avoids downloading every archive once per architecture
  cache_archives:
    name: Cache archive ${{ matrix.archive.version }}
    runs-on: ubuntu-latest
    needs:
      - check_envoronment
      - generate_matrix
    if: needs.check_envoronment.outputs.action == 'build' || needs.check_envoronment.outputs.action == 'publish'
    strategy:
      fail-fast: false
      matrix:
        archive: ${{ fromJSON(needs.generate_matrix.outputs.archives) }}
    steps:
      -
        name: Compute cache key
        id: key
        run: echo "key=c5-archive-$(printf '%s' '${{ matrix.archive.url }}' | sha1sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      -
        name: Restore cache
        id: cache
        uses: actions/cache@v6
        with:
          path: /tmp/c5-archive
          key: ${{ steps.key.outputs.key }}
      -
        name: Download archive
        run: |
          if [ '${{ steps.cache.outputs.cache-hit }}' = true ]; then
            echo 'Already cached'
          else
            mkdir -p /tmp/c5-archive
            curl -sSLf --retry 2 --retry-delay 10 --retry-all-errors -o /tmp/c5-archive/archive '${{ matrix.archive.url }}'
            unzip -tq /tmp/c5-archive/archive >/dev/null
            echo 'Downloaded'
          fi

  build:
    name: Build ${{ matrix.data.image_tag }} (${{ matrix.runner.arch }})
    runs-on: ${{ matrix.runner.os }}
    needs:
      - check_envoronment
      - build_base
      - publish_base
      - generate_matrix
      - cache_archives
    # publish_base is skipped when not publishing
    if: >-
      ${{
        !cancelled()
        && needs.build_base.result == 'success'
        && needs.generate_matrix.result == 'success'
        && needs.cache_archives.result == 'success'
        && (
          (needs.check_envoronment.outputs.action == 'build' && needs.publish_base.result == 'skipped')
          || (needs.check_envoronment.outputs.action == 'publish' && needs.publish_base.result == 'success')
        )
      }}
    strategy:
      matrix:
        data: ${{ fromJSON(needs.generate_matrix.outputs.generated-matrix) }}
        runner:
          -
            os: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          -
            os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
      -
        name: Download base image
        if: needs.check_envoronment.outputs.action == 'build'
        uses: actions/download-artifact@v8
        with:
          name: base-image-${{ matrix.runner.arch }}
          path: /tmp/
      -
        name: Extract base image
        if: needs.check_envoronment.outputs.action == 'build'
        run: |
          mkdir /tmp/base-image
          tar -xf /tmp/base-image.tar -C /tmp/base-image
          rm /tmp/base-image.tar
      -
        name: Compute archive cache key
        id: key
        if: ${{ !matrix.data.repo_branch }}
        run: echo "key=c5-archive-$(printf '%s' '${{ matrix.data.c5_archive }}' | sha1sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      -
        name: Restore Concrete archive
        if: ${{ !matrix.data.repo_branch }}
        uses: actions/cache/restore@v6
        with:
          path: /tmp/c5-archive
          key: ${{ steps.key.outputs.key }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Configure build
        id: config
        run: |
          {
            echo 'build-contexts<<EOF'
            if [ '${{ needs.check_envoronment.outputs.action }}' = build ]; then
              echo 'ghcr.io/concrete5-community/docker5:base=oci-layout:///tmp/base-image:base'
            fi
            # If the archive is not in the cache, the build downloads it
            if [ -f /tmp/c5-archive/archive ]; then
              echo 'c5-archive=/tmp/c5-archive'
            fi
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      -
        name: Build with starting point ${{ matrix.data.c5_startingpoint }}
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: ./installed
          platforms: ${{ matrix.runner.platform }}
          build-contexts: ${{ steps.config.outputs.build-contexts }}
          build-args: |
            CI=true
            CCM_PHP_VERSION=${{ matrix.data.php_version }}
            CCM_COMPOSER_VERSION=${{ matrix.data.composer_version }}
            CCM_PHPUNIT_VERSION=${{ matrix.data.phpunit_version }}
            CCM_C5_ARCHIVE=${{ matrix.data.c5_archive }}
            CCM_STARTING_POINT=${{ matrix.data.c5_startingpoint }}
            CCM_PATCH_ENVIRONMENT_ONLY=${{ matrix.data.patch_environment_only }}
          tags: ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }}
          load: true
      -
        name: Check that MariaDB works
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-service start db
      -
        name: Test installing composerpkg
        if: needs.check_envoronment.outputs.action == 'build' && matrix.data.image_tag == '9.4.1'
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-install composerpkg
      -
        name: Test installing Blocks Cloner
        if: needs.check_envoronment.outputs.action == 'build' && matrix.data.image_tag == '9.4.1'
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-install blocks_cloner
      -
        name: Test installing concrete-cif
        if: needs.check_envoronment.outputs.action == 'build' && matrix.data.image_tag == '9.4.1'
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-install concrete-cif
      -
        name: Test installing PHP CS Fixer
        if: needs.check_envoronment.outputs.action == 'build' && matrix.data.image_tag == '9.4.1'
        run: docker run --rm --entrypoint='' ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }} ccm-install php-cs-fixer
      -
        name: Login to the Docker container registry
        if: needs.check_envoronment.outputs.action == 'publish'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Push image
        if: needs.check_envoronment.outputs.action == 'publish'
        uses: docker/build-push-action@v7
        with:
          provenance: false
          context: ./installed
          platforms: ${{ matrix.runner.platform }}
          build-contexts: ${{ steps.config.outputs.build-contexts }}
          build-args: |
            CI=true
            CCM_PHP_VERSION=${{ matrix.data.php_version }}
            CCM_COMPOSER_VERSION=${{ matrix.data.composer_version }}
            CCM_PHPUNIT_VERSION=${{ matrix.data.phpunit_version }}
            CCM_C5_ARCHIVE=${{ matrix.data.c5_archive }}
            CCM_STARTING_POINT=${{ matrix.data.c5_startingpoint }}
            CCM_PATCH_ENVIRONMENT_ONLY=${{ matrix.data.patch_environment_only }}
          # Taken from the build cache of the previous step
          tags: ghcr.io/concrete5-community/docker5:${{ matrix.data.image_tag }}-${{ matrix.runner.arch }}
          push: true

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs:
      - check_envoronment
      - generate_matrix
      - build
    if: needs.check_envoronment.outputs.action == 'publish'
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to the Docker container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Create multi-platform manifests
        env:
          GENERATED_MATRIX: ${{ needs.generate_matrix.outputs.generated-matrix }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          mapfile -t entries < <(printf '%s' "$GENERATED_MATRIX" | jq -c '.[]')
          for entry in "${entries[@]}"; do
            image_tag="$(printf '%s' "$entry" | jq -r '.image_tag')"
            additional_tags="$(printf '%s' "$entry" | jq -r '.additional_tags')"
            echo "::group::Publishing $image_tag"
            tags="--tag ghcr.io/concrete5-community/docker5:$image_tag"
            for additional_tag in $additional_tags; do
              tags="$tags --tag ghcr.io/concrete5-community/docker5:$additional_tag"
            done
            docker buildx imagetools create $tags "ghcr.io/concrete5-community/docker5:$image_tag-amd64" "ghcr.io/concrete5-community/docker5:$image_tag-arm64"
            docker buildx imagetools inspect "ghcr.io/concrete5-community/docker5:$image_tag"
            echo '::endgroup::'
          done

  store-data-matrix:
    name: Store data matrix
    runs-on: ubuntu-latest
    needs:
      - check_envoronment
      - generate_matrix
    if: needs.check_envoronment.outputs.action == 'publish' || needs.check_envoronment.outputs.action == 'update-data-matrix-only'
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
      -
        name: Store data matrix
        env:
          GENERATED_MATRIX: ${{ needs.generate_matrix.outputs.generated-matrix }}
        run: printf '%s' "$GENERATED_MATRIX" >data/matrix.json
      -
        name: Commit data matrix
        run: |
          git add data/matrix.json
          if git diff --cached --color=always --exit-code data/matrix.json; then
            echo 'No changes'
          else
            git config --local user.name 'GitHub Actions'
            git config --local user.email noreply@github.com
            git add data/matrix.json
            git commit -m 'Update data matrix'
            git push
          fi
